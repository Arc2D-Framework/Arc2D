        <!-- <script>

        <script>
            (function createMemoryBackedStylesheets() {
                function createMemoryStyle(id, rules) {
                    const style = document.createElement("style");
                    style.id = id;
                    style.setAttribute("data-memory-backed-test", "true");
                    document.head.appendChild(style);

                    rules.forEach(rule => {
                        try {
                            style.sheet.insertRule(rule, style.sheet.cssRules.length);
                        } catch (error) {
                            console.warn("Unable to insert memory stylesheet test rule", rule, error);
                        }
                    });
                }

                createMemoryStyle("memory-backed-style-a", [
                    ".memory-backed-test { border: 2px solid #d24b4b; padding: 12px; margin: 16px 0; background: #fff7d6; color: #222; font: 14px/1.4 system-ui, sans-serif; }",
                    ".memory-backed-test strong { color: #7a2f8f; }",
                    "@media (min-width: 700px) { .memory-backed-test { max-width: 520px; } }"
                ]);

                createMemoryStyle("memory-backed-style-b", [
                    "@keyframes memory-backed-pulse { from { box-shadow: 0 0 0 0 rgba(210, 75, 75, 0.55); } to { box-shadow: 0 0 0 8px rgba(210, 75, 75, 0); } }",
                    ".memory-backed-test::after { content: ' memory stylesheet active'; display: block; margin-top: 6px; font-size: 12px; color: #555; }",
                    ".memory-backed-test { animation: memory-backed-pulse 1.8s ease-out infinite alternate; }"
                ]);

                createMemoryStyle("base64-image-fixture-style", [
                    ".base64-image-fixture { display: grid; grid-template-columns: repeat(4, minmax(90px, 1fr)); gap: 10px; max-width: 620px; margin: 16px 0; font: 12px/1.4 system-ui, sans-serif; color: #222; }",
                    ".base64-image-fixture figure { margin: 0; padding: 8px; border: 1px solid #bbb; background: #f7f7f7; }",
                    ".base64-image-fixture img { display: block; width: 100%; height: 76px; object-fit: cover; background: #ddd; }",
                    ".base64-background-fixture { min-height: 76px; border: 1px solid #777; background-image: url('../resources/images/placeholder.jpg'); background-size: cover; background-position: center; }",
                    ".base64-layered-background-fixture { min-height: 76px; border: 1px solid #777; background-image: linear-gradient(rgba(255,255,255,.2), rgba(0,0,0,.2)), url('../resources/img/nature.jpg'); background-size: cover; background-position: center; }"
                ]);

                const memoryBackedCount = Array.from(document.styleSheets).filter(sheet =>
                    sheet.ownerNode instanceof HTMLStyleElement &&
                    sheet.cssRules.length &&
                    !sheet.ownerNode.textContent
                ).length;
                console.log("[Arc2D demo] memory-backed stylesheet fixtures ready:", memoryBackedCount);

                window.addEventListener("load", () => {
                    const base64Candidates = Array.from(document.querySelectorAll("img")).filter(img =>
                        img.src && !img.src.startsWith("data:")
                    ).length + Array.from(document.querySelectorAll(".base64-background-fixture, .base64-layered-background-fixture")).length;
                    console.log("[Arc2D demo] base64 image fixtures ready:", base64Candidates);
                });
            })();
        </script>

        <div class="memory-backed-test">

            these styles come from empty style owner nodes populated through CSSOM insertRule().
        </div>

        <section class="base64-image-fixture" aria-label="Base64 image export fixtures">

            </figure>
            <figure>

            </figure>
            <figure>

            </figure>
            <figure>
                <div class="base64-layered-background-fixture"></div>
                <figcaption>layered background</figcaption>
            </figure>
        </section>

        <message-bar>
            <template shadowrootmode="open">

                            </template>
                        </message-bar-extended-child>
                    </template>
                </message-bar-extended>
            </template>
        </message-bar>
