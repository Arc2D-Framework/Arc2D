        <script type="module">
            import * as LiveKit from 'https://cdn.jsdelivr.net/npm/livekit-client@2.17.2/+esm';
            import TourGuide from '../src/libs/tour.js';
            import LiveAvatarVoiceAgent, {
                LiveAvatarBrowserService,
                LiveAvatarProxyService
            } from '../src/libs/aivoice2.js';

            document.addEventListener('DOMContentLoaded', async () => {
                const demoConfig = {
                    liveAvatarApiKey: '9da8fa52-2f59-11f1-8d28-066a7fa2e369',
                    avatarId: '65f9e3c9-d48b-4118-b73a-4ae2e3cbb8f0',
                    contextId: '65315879-21e9-4a64-ad86-dc810091ef65',
                    voiceId: 'b2bd6569-a537-4342-aeca-a1f15d2a2c97',
                    systemPrompt: 'You are a friendly spoken sales and support rep for the company on this website. Sound natural, warm, and confident. Help people understand services, guide them toward the next best action, and use tours only when they would genuinely help.',
                    instructions: 'Use the current TourGuide context to answer questions about the page and the tours. Mention relevant tours when helpful, but always ask before starting one. Keep your replies concise and conversational. If the user confirms they want a tour, reply with one short sentence only and do not describe the tour steps or contents because the TourGuide UI will take over.',
                    openingText: 'Hi there, I am here to help you explore this page and walk you through anything you would like to see.',
                    isSandbox: true,
                    voiceChatVisualizer: {
                        mode: 'embed-frame',
                        label: 'Live avatar guide',
                        placeholder: 'Start voice chat to load the LiveAvatar agent.'
                    },
                    activeService: 'proxy',
                    proxySessionEndpoint: '/api/liveavatar/session',
                    proxyTranscriptEndpointBase: '/api/liveavatar/transcript'
                };

                const services = {
                    browser: new LiveAvatarBrowserService({
                        apiKey: demoConfig.liveAvatarApiKey
                    }),
                    proxy: new LiveAvatarProxyService({
                        apiKey: demoConfig.liveAvatarApiKey,
                        sessionEndpoint: demoConfig.proxySessionEndpoint,
                        transcriptEndpointBase: demoConfig.proxyTranscriptEndpointBase
                    })
                };
                const activeService = services[demoConfig.activeService] || services.browser;

                console.log('[TourGuide LiveAvatar][services]', {
                    services: Object.keys(services),
                    active: Object.entries(services).find(([, service]) => service === activeService)?.[0] || 'custom'
                });

                const aiVoice = new LiveAvatarVoiceAgent({
                    service: activeService,
                    liveKit: LiveKit,
                    apiKey: demoConfig.liveAvatarApiKey,
                    avatarId: demoConfig.avatarId,
                    contextId: demoConfig.contextId,
                    voiceId: demoConfig.voiceId,
                    isSandbox: demoConfig.isSandbox,
                    systemPrompt: demoConfig.systemPrompt,
                    instructions: demoConfig.instructions,
                    openingText: demoConfig.openingText,
                    visualizerLabel: demoConfig.voiceChatVisualizer.label,
                    visualizerPlaceholder: demoConfig.voiceChatVisualizer.placeholder
                });

                aiVoice.addEventListener('transcriberstatechange', event => {
                    console.log('[TourGuide LiveAvatar][state]', event.detail.state);
                });

                aiVoice.addEventListener('chatpreparestart', () => {
                    console.log('[TourGuide LiveAvatar][prepare] starting');
                });

                aiVoice.addEventListener('chatprepareready', event => {
                    console.log('[TourGuide LiveAvatar][prepare] ready', event.detail.ready);
                });

                aiVoice.addEventListener('finaltranscript', event => {
                    console.log('[TourGuide LiveAvatar][final]', event.detail.text);
                });

                aiVoice.addEventListener('response', event => {
                    console.log(`[TourGuide LiveAvatar][response:${event.detail.response?.provider || 'unknown'}]`, event.detail.text);
                });

                aiVoice.addEventListener('action', event => {
                    console.log('[TourGuide LiveAvatar][action]', event.detail.action, event.detail.response?.targetTourKey || null);
                });

                aiVoice.addEventListener('speechstart', event => {
                    console.log('[TourGuide LiveAvatar][speechstart]', event.detail.text);
                });

                aiVoice.addEventListener('speechend', event => {
                    console.log('[TourGuide LiveAvatar][speechend]', event.detail.text);
                });

                aiVoice.addEventListener('visualizerchange', event => {
                    console.log('[TourGuide LiveAvatar][visualizer]', event.detail.config);
                });

                aiVoice.addEventListener('error', event => {
                    console.error('[TourGuide LiveAvatar][error]', event.detail.error);
                });

                const tour = new TourGuide();
                const cleanupVoice = () => {
                    try {
                        tour.setAIVoice?.(null);
                    } catch {}
                    try {
                        aiVoice.destroy?.();
                    } catch {}
                };

                window.addEventListener('pagehide', cleanupVoice, { once: true });
                window.addEventListener('beforeunload', cleanupVoice, { once: true });

                await tour.install({
                    data : "./help-demo.json",
                    show_tour_listing: true,
                    voice_chat_visualizer: demoConfig.voiceChatVisualizer,
                    ai_voice: aiVoice
                });
            });
        </script>
